<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'"
    />
    <title>Codex Mini Meter</title>
    <link rel="stylesheet" href="mini.css" />
  </head>
  <body>
    <main class="pet">
      <header>
        <span id="bucket-name">CODEX METER</span
        ><button
          id="expand"
          title="Open detailed window"
          aria-label="Open detailed window"
        >
          ↗</button
        ><button id="hide" title="Hide to tray" aria-label="Hide to tray">
          ×
        </button>
      </header>
      <div class="gauges">
        <section>
          <span>5 HOUR</span>
          <div id="short-gauge"></div>
        </section>
        <section>
          <span>WEEKLY</span>
          <div id="weekly-gauge"></div>
        </section>
      </div>
      <footer>
        <span id="mini-status" role="status">Connecting…</span
        ><button id="refresh" aria-label="Refresh usage" title="Refresh usage">
          ↻
        </button>
      </footer>
    </main>
    <script src="gauge.js"></script>
    <script src="mini.js"></script>
  </body>
</html>
